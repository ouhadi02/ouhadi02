<svg xmlns="http://www.w3.org/2000/svg" width="470" height="214" viewBox="0 0 470 214" role="img"><title>Log Anomaly Detector</title><rect x="7" y="7" width="462" height="206" rx="14" fill="#1d5a51"/><rect x="1" y="1" width="462" height="206" rx="14" fill="#0f1a18" stroke="#5eead4" stroke-width="1.6"/><rect x="22" y="22" width="38" height="38" rx="9" fill="#5eead4" fill-opacity=".14" stroke="#5eead4" stroke-opacity=".8"/><text x="41" y="47" font-family="'Consolas','SFMono-Regular','Menlo','DejaVu Sans Mono',monospace" font-size="15" font-weight="700" fill="#5eead4" text-anchor="middle">SI</text><text x="72" y="38" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="800" fill="#e8f1ee">Log Anomaly Detector</text><text x="72" y="57" font-family="'Consolas','SFMono-Regular','Menlo','DejaVu Sans Mono',monospace" font-size="12" fill="#5eead4">Cybersecurity · ML · team project</text><text x="24" y="88" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#e8f1ee" fill-opacity=".9">Real-time log monitoring and anomaly detection:</text><text x="24" y="107" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#e8f1ee" fill-opacity=".9">Filebeat, Logstash, Elasticsearch and Kibana, with a</text><text x="24" y="126" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#e8f1ee" fill-opacity=".9">Python ML component, all in Docker.</text><text x="24" y="162" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#5eead4">Team project with Moaad and Chaima Menouar</text><rect x="24" y="174" width="56" height="22" rx="11" fill="#5eead4" fill-opacity=".1" stroke="#5eead4" stroke-opacity=".7"/><text x="52.0" y="189" font-family="'Consolas','SFMono-Regular','Menlo','DejaVu Sans Mono',monospace" font-size="11.5" fill="#5eead4" text-anchor="middle">Python</text><rect x="88" y="174" width="106" height="22" rx="11" fill="#5ee